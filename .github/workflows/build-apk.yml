name: Build signed MacroDeck APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MACRODECK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing repository secret: MACRODECK_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/macrodeck-release.jks"

      - name: Build signed release APK
        env:
          MACRODECK_KEYSTORE_PATH: ${{ runner.temp }}/macrodeck-release.jks
          MACRODECK_KEYSTORE_PASSWORD: ${{ secrets.MACRODECK_KEYSTORE_PASSWORD }}
          MACRODECK_KEY_ALIAS: ${{ secrets.MACRODECK_KEY_ALIAS }}
          MACRODECK_KEY_PASSWORD: ${{ secrets.MACRODECK_KEY_PASSWORD }}
        run: |
          test -n "$MACRODECK_KEYSTORE_PASSWORD" || (echo "Missing MACRODECK_KEYSTORE_PASSWORD" && exit 1)
          test -n "$MACRODECK_KEY_ALIAS" || (echo "Missing MACRODECK_KEY_ALIAS" && exit 1)
          test -n "$MACRODECK_KEY_PASSWORD" || (echo "Missing MACRODECK_KEY_PASSWORD" && exit 1)
          gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk MacroDeck-1.2.1.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MacroDeck-1.2.1-signed-apk
          path: MacroDeck-1.2.1.apk
          if-no-files-found: error
          retention-days: 30
